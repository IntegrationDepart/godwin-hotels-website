<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C1737"/>
      <stop offset="100%" stop-color="#720C23"/>
    </linearGradient>
    <linearGradient id="orangeGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F78320"/>
      <stop offset="100%" stop-color="#DE5E00"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8922E"/>
      <stop offset="100%" stop-color="#F2C975"/>
    </linearGradient>
  </defs>

  <!-- Outer Elegant Gold Ring -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#ringGold)" stroke-width="2"/>

  <!-- Inner Subtle Backing -->
  <circle cx="50" cy="50" r="46.5" fill="#FFFFFF"/>

  <!-- Upper Maroon Leaf / Petal -->
  <path d="M 28 40
           C 36 29, 52 24, 70 27
           C 78 28, 86 34, 94 46
           C 84 52, 70 54, 56 46
           C 46 40, 36 39, 28 40 Z"
        fill="url(#maroonGradT)"/>
  
  <!-- Spine Vein -->
  <path d="M 33 39
           C 44 32, 58 31, 72 36
           C 66 38, 54 37, 44 41 Z"
        fill="#FFFFFF" opacity="0.4"/>

  <!-- Lower Orange Hand / Petal -->
  <path d="M 6 48
           C 14 42, 28 42, 42 47
           C 52 50, 66 54, 78 57
           C 80 58, 80 60, 76 61
           C 64 63, 56 61, 48 57
           C 52 61, 56 62, 62 64
           C 52 67, 42 67, 32 64
           C 20 61, 12 55, 6 48 Z"
        fill="url(#orangeGradT)"/>
</svg>
